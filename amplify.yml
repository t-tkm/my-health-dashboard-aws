version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # VITE_* 環境変数は Amplify コンソールの「環境変数」で設定する
        # 必須: VITE_USER_POOL_ID, VITE_USER_POOL_CLIENT_ID,
        #        VITE_COGNITO_DOMAIN, VITE_API_ENDPOINT
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
